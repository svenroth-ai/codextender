version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # litellm is pinned on purpose: a bump must re-verify every patch in
    # src/codextender/patch.py, so it is done by hand. Security updates are
    # not affected by this rule.
    ignore:
      - dependency-name: "litellm"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/npm"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
