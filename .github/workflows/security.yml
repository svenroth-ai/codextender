name: Security

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install project and pip-audit
        # setuptools ships preinstalled on the runner and is not a project
        # dependency; upgrade it so the audit only reports what we depend on.
        run: pip install -U pip setuptools && pip install -e . pip-audit
      # Audits the resolved environment, so transitive dependencies are covered.
      - name: pip-audit
        # filelock 3.32.7 is pulled in by litellm (and huggingface-hub), and
        # litellm 1.106.6 caps it at <4.0 (Requires-Dist: filelock<4.0,>=3.16.1).
        # The advisories below are only fixed in filelock 4.x, so they cannot
        # be resolved while litellm is pinned. Remove this list once a litellm
        # release lifts the cap and the pin is bumped.
        run: |
          pip-audit --skip-editable \
            --ignore-vuln GHSA-v4x8-3wr5-3wq8 \
            --ignore-vuln GHSA-9vhv-jxww-xfm5 \
            --ignore-vuln GHSA-567q-5qvw-pf92 \
            --ignore-vuln GHSA-m462-7rxw-wvpg \
            --ignore-vuln GHSA-j8f7-rjxc-mr56 \
            --ignore-vuln GHSA-8mx5-7m5m-r77g \
            --ignore-vuln GHSA-69hj-f68j-2879 \
            --ignore-vuln GHSA-9c4x-gm8v-wgc4 \
            --ignore-vuln GHSA-rfpc-qcw5-3pc4 \
            --ignore-vuln GHSA-cwqr-hh33-gh44 \
            --ignore-vuln GHSA-fq56-3cx3-fjxp \
            --ignore-vuln GHSA-9j6q-wvj5-jgjg \
            --ignore-vuln GHSA-6627-m3xw-93mp

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install semgrep
      - name: Semgrep
        run: semgrep scan --config p/python --config p/security-audit --metrics=off --error src scripts npm

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          GITLEAKS_VERSION="8.21.2"
          GITLEAKS_SHA256="5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -qO "$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL" gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Gitleaks (full history)
        run: gitleaks detect --source . --redact --exit-code 1
